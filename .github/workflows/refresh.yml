name: Daily CDR refresh

on:
  schedule:
    # 17:23 UTC = 4:23 am Melbourne (AEDT) / 3:23 am (AEST)
    - cron: '23 17 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['site/**', 'pipeline/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (PDF reader)
        if: github.event_name != 'push'
        run: npm ci --no-audit --no-fund

      - name: Install headless Chromium (reads pages that need JavaScript)
        if: github.event_name != 'push'
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Fetch every bank's product data, check websites and PDFs, build insights
        if: github.event_name != 'push'
        env:
          CDR_WEB_RENDER: '1'
          CDR_WEB_BUDGET_MIN: '40'
        run: node pipeline/build.mjs

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "cdr-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          # The data is fully regenerated each run, so never merge it: set it aside,
          # sync to the latest repo, put the fresh data back and commit. Retries on races.
          cp -r site/data "$RUNNER_TEMP/newdata"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf site/data
            cp -r "$RUNNER_TEMP/newdata" site/data
            git add -A site/data
            if git diff --cached --quiet; then
              echo "No data changes"
              break
            fi
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            if git push origin HEAD:main; then
              break
            fi
            echo "Push rejected, retrying ($i)"
            sleep 5
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
