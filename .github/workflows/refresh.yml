name: Daily CDR refresh

on:
  schedule:
    # 17:23 UTC = 4:23 am Melbourne (AEDT) / 3:23 am (AEST)
    - cron: '23 17 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['site/**', 'pipeline/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch every bank's product data and build insights
        if: github.event_name != 'push'
        run: node pipeline/build.mjs

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "cdr-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
